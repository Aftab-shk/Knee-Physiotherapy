name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU wheels only. The CUDA build is ~1.5 GB and nothing here needs a GPU:
      # the test suite runs against pure functions and a stubbed classifier.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.0 torchvision==0.18.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          # Training/test-only deps. test_calibration.py imports the calibration
          # maths from model/train.py, which pulls in matplotlib and sklearn;
          # without these those 8 tests error out at collection.
          pip install -r backend/requirements-dev.txt
          pip install ruff

      - name: Lint
        run: ruff check backend/

      - name: Test
        run: python -m pytest backend/tests -q

      # The clinical logic and API tests must not silently start depending on
      # torch or a checkpoint — that is what keeps them runnable anywhere.
      - name: Test without torch installed
        run: |
          pip uninstall -y torch torchvision
          python -m pytest backend/tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No build step and no dependencies — assets/pose-gate.js is loaded
      # directly by tracker.html and imported unchanged by the tests, so what
      # runs here is exactly what runs in the browser.
      - name: Test pose gate
        run: node --test
        working-directory: frontend

  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A 70 MB checkpoint sat tracked in this repo for four commits because a
      # .gitignore pattern was anchored to the wrong directory. This fails the
      # build rather than letting it happen again quietly.
      - name: Reject large tracked files
        run: |
          limit=$((5 * 1024 * 1024))
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$((size / 1024 / 1024)) MB tracked in git (limit 5 MB) — use a Release, see backend/model/fetch_weights.py"
              fail=1
            fi
          done < <(git ls-files)
          exit $fail
